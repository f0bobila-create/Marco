// Remplace les imports "lucide-react" : chaque icône devient un composant

function makeIcon(kebabName) {
  return function LucideIcon({ size = 18, className = "", strokeWidth }) {
    return <i data-lucide={kebabName} className={className} width={size} height={size} stroke-width={strokeWidth}></i>;
  };
}

  { id: "V-00219", product: "AirPods Pro 2", imei: "S/N AP2-778312", client: "Lucie Martin", phone: "06 21 09 88 77", date: "18/05/2026", daysLeft: 89 },

];

function warrantyStatus(daysLeft) {
  if (daysLeft < 0) return "expired";
  if (daysLeft <= 7) return "warning";
  return "active";
}

function randomImei() {
  let s = "35" + Math.floor(1000000000 + Math.random() * 8999999999).toString();
  return s.slice(0, 6) + " " + s.slice(6, 8) + " " + s.slice(8, 12);
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 1046;
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.13);
  } catch (e) {}
}

function vibrate() {
  try { if (navigator.vibrate) navigator.vibrate(18); } catch (e) {}
}

function cx(...arr) { return arr.filter(Boolean).join(" "); }

// ---------- Devises ----------
// Les montants métier (prix produits, CA...) sont stockés en EUR dans les mocks
// et convertis à l'affichage selon la devise choisie dans les Réglages.
const CURRENCIES = {
  XAF: { code: "XAF", label: "Franc CFA (BEAC)", symbol: "FCFA", position: "after", decimals: 0, rate: 655.96 },
  EUR: { code: "EUR", label: "Euro", symbol: "€", position: "after", decimals: 2, rate: 1 },
  USD: { code: "USD", label: "Dollar US", symbol: "$", position: "before", decimals: 2, rate: 1.09 },
  MAD: { code: "MAD", label: "Dirham marocain", symbol: "DH", position: "after", decimals: 2, rate: 10.85 },
  GBP: { code: "GBP", label: "Livre sterling", symbol: "£", position: "before", decimals: 2, rate: 0.86 },
};

function formatMoney(amountEUR, currency) {
  const value = amountEUR * currency.rate;
  const formatted = value.toLocaleString("fr-FR", {
    minimumFractionDigits: currency.decimals,
    maximumFractionDigits: currency.decimals,
  });
  return currency.position === "before" ? `${currency.symbol} ${formatted}` : `${formatted} ${currency.symbol}`;
}

const STATUS_STYLE = {

// ---------- App ----------
function GarantiProApp() {
  const [theme, setTheme] = useState("light");
  const [tab, setTab] = useState("dashboard");
  const [scanOpen, setScanOpen] = useState(false);
  const [scanContext, setScanContext] = useState("stock");
  const [stockItems, setStockItems] = useState([]);
  const [sales, setSales] = useState(INITIAL_SALES);
  const [toast, setToast] = useState(null);
  const [currencyCode, setCurrencyCode] = useState("XAF");

  // Hydrate les icônes Lucide (CDN) après chaque rendu
  useLayoutEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  // Authentification & abonnement
  const [authStep, setAuthStep] = useState("login"); // 'login' | 'signup' | 'plan' | 'app'
  const [account, setAccount] = useState(null); // { storeName, ownerName, email, phone }
  const [subscription, setSubscription] = useState(null); // { planId, status: 'trial'|'active', trialDaysLeft }
  const [planPickerOpen, setPlanPickerOpen] = useState(false);

  const t = TH[theme];
  const cur = CURRENCIES[currencyCode];

  function handleSignup(data) {
    setAccount(data);
    setAuthStep("plan");
  }

  function handleLogin(data) {
    setAccount({ storeName: "Mobile Store Plus", ownerName: "Vendeur", email: data.email, phone: "" });
    setSubscription({ planId: "pro", status: "active", trialDaysLeft: 0 });
    setAuthStep("app");
  }

  function handlePlanChosen(planId) {
    setSubscription({ planId, status: "trial", trialDaysLeft: 14 });
    setAuthStep("app");
    setPlanPickerOpen(false);
    showToast("Abonnement activé · essai gratuit 14 jours");
  }

  function handleChangePlan(planId) {
    setSubscription((prev) => ({ ...prev, planId }));
    setPlanPickerOpen(false);
    showToast("Abonnement mis à jour");
  }

  function handleLogout() {
    setAuthStep("login");
    setAccount(null);
    setSubscription(null);
    setTab("dashboard");
  }

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }

  function openScan(ctx) {
    setScanContext(ctx);
    setScanOpen(true);
  }

  function handleDetect() {
    beep();
    vibrate();
    if (scanContext === "stock") {
      setStockItems((prev) => [{ imei: randomImei(), condition: "Neuf" }, ...prev]);
    } else {
      setScanOpen(false);
      setTab("caisse-sell");
    }
  }

  return (
    <div className={cx("min-h-screen w-full flex items-center justify-center p-4", t.canvas)} style={{ fontFamily: "Inter, system-ui, sans-serif" }}>
      <style>{`
        @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.45); } 50% { box-shadow: 0 0 0 14px rgba(99,102,241,0); } }
        @keyframes scanLine { 0% { top: 6%; } 50% { top: 92%; } 100% { top: 6%; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .anim-slideup { animation: slideUp 0.35s ease both; }
        .anim-fadein { animation: fadeIn 0.25s ease both; }
        .anim-popin { animation: popIn 0.3s cubic-bezier(.34,1.56,.64,1) both; }
        .mono { font-family: 'JetBrains Mono', 'Roboto Mono', monospace; }
      `}</style>

      {/* Cadre "téléphone" */}
      <div
        className={cx("relative overflow-hidden shadow-2xl", t.app)}
        style={{ width: 390, maxWidth: "100%", height: 820, maxHeight: "92vh", borderRadius: "2.75rem", border: theme === "dark" ? "8px solid #020617" : "8px solid #0f172a" }}
      >
        {/* Encoche */}
        <div className="absolute top-0 left-1/2 z-30 h-6 w-32 -translate-x-1/2 rounded-b-2xl bg-black" />

        <div className="flex h-full flex-col">
          {authStep === "login" || authStep === "signup" ? (
            <AuthScreen t={t} theme={theme} setTheme={setTheme} mode={authStep} setMode={setAuthStep} onLogin={handleLogin} onSignup={handleSignup} />
          ) : authStep === "plan" ? (
            <PlanSelectionScreen t={t} theme={theme} cur={cur} currentPlanId="pro" onSelect={handlePlanChosen} intro />
          ) : (
            <>
              <TopBar t={t} theme={theme} tab={tab} setTab={setTab} setTheme={setTheme} account={account} />

              <div className="flex-1 overflow-y-auto px-4 pb-28 pt-3">
                {tab === "dashboard" && <Dashboard t={t} theme={theme} sales={sales} setTab={setTab} cur={cur} subscription={subscription} />}
                {tab === "stock" && <StockScreen t={t} theme={theme} items={stockItems} openScan={openScan} cur={cur} />}
                {(tab === "caisse" || tab === "caisse-sell") && (
                  <CaisseScreen t={t} theme={theme} openScan={openScan} showToast={showToast} tab={tab} setTab={setTab} setSales={setSales} sales={sales} cur={cur} />
                )}
                {tab === "recherche" && <RechercheScreen t={t} theme={theme} sales={sales} />}
                {tab === "settings" && (
                  <SettingsScreen
                    t={t} theme={theme} setTheme={setTheme}
                    currencyCode={currencyCode} setCurrencyCode={setCurrencyCode}
                    account={account} subscription={subscription} cur={cur}
                    onChangePlan={() => setPlanPickerOpen(true)}
                    onLogout={handleLogout}
                  />
                )}
              </div>

              <BottomNav t={t} theme={theme} tab={tab} setTab={setTab} openScan={openScan} />
            </>
          )}
        </div>

        {scanOpen && <ScanOverlay t={t} theme={theme} context={scanContext} count={stockItems.length} onDetect={handleDetect} onClose={() => setScanOpen(false)} />}

        {planPickerOpen && (
          <div className="absolute inset-0 z-40 flex flex-col anim-fadein" style={{ backgroundColor: theme === "dark" ? "#020617" : "#f8fafc" }}>
            <PlanSelectionScreen
              t={t} theme={theme} cur={cur}
              currentPlanId={subscription ? subscription.planId : "pro"}
              onSelect={handleChangePlan}
              onBack={() => setPlanPickerOpen(false)}
            />
          </div>
        )}

        {toast && (
          <div className="absolute bottom-28 left-1/2 z-50 -translate-x-1/2 anim-popin">
            <div className="flex items-center gap-2 rounded-full bg-slate-900 px-4 py-2.5 text-sm font-medium text-white shadow-xl">
              <Check size={16} className="text-emerald-400" />
              {toast}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- TopBar ----------
function TopBar({ t, theme, tab, setTab, setTheme, account }) {
  const titles = {
    dashboard: "Tableau de bord",
    stock: "Stock & Arrivage",
    caisse: "Caisse",
    "caisse-sell": "Nouvelle vente",
    recherche: "Recherche",
    settings: "Réglages",
  };
  return (
    <div className={cx("z-20 flex items-center justify-between px-4 pb-3 pt-9", t.surface, "border-b", t.border)}>
      {tab === "settings" || tab === "caisse-sell" ? (
        <button
          onClick={() => setTab(tab === "settings" ? "dashboard" : "caisse")}
          className={cx("flex h-9 w-9 items-center justify-center rounded-full", t.surfaceAlt)}
        >
          <ChevronLeft size={18} className={t.text} />
        </button>
      ) : (
        <div className="flex items-center gap-2">
          <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-600 to-cyan-500">
            <Store size={17} className="text-white" />
          </div>
          <div>
            <p className={cx("text-sm font-semibold leading-tight", t.text)}>{(account && account.storeName) || "Ma boutique"}</p>
            <p className={cx("text-xs leading-tight", t.sub)}>{titles[tab]}</p>
          </div>
        </div>
      )}

      {tab !== "settings" && tab !== "caisse-sell" && (
        <div className="flex items-center gap-2">
          <button onClick={() => setTheme(theme === "light" ? "dark" : "light")} className={cx("flex h-9 w-9 items-center justify-center rounded-full", t.surfaceAlt)}>
            {theme === "light" ? <Moon size={16} className={t.text} /> : <Sun size={16} className={t.text} />}
          </button>
          <button className={cx("relative flex h-9 w-9 items-center justify-center rounded-full", t.surfaceAlt)}>
            <Bell size={16} className={t.text} />
            <span className="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-rose-500" />
          </button>
          <button onClick={() => setTab("settings")} className={cx("flex h-9 w-9 items-center justify-center rounded-full", t.surfaceAlt)}>
            <Settings size={16} className={t.text} />
          </button>
        </div>
      )}
      {tab === "settings" && <p className={cx("text-sm font-semibold", t.text)}>Réglages</p>}
      {tab === "caisse-sell" && <p className={cx("text-sm font-semibold", t.text)}>Étape 2/2</p>}
      {(tab === "settings" || tab === "caisse-sell") && <div className="w-9" />}
    </div>
  );
}

// ---------- Bottom Nav ----------
function BottomNav({ t, theme, tab, setTab, openScan }) {
  const items = [
    { id: "dashboard", icon: Home, label: "Accueil" },
    { id: "stock", icon: Package, label: "Stock" },
    { id: "__fab__", icon: ScanLine, label: "" },
    { id: "caisse", icon: ShoppingCart, label: "Caisse" },
    { id: "recherche", icon: Search, label: "Recherche" },
  ];
  return (
    <div className={cx("absolute bottom-0 left-0 right-0 z-20 border-t", t.nav, t.border)} style={{ paddingBottom: 18 }}>
      <div className="relative flex items-end justify-between px-5 pt-2.5">
        {items.map((it) => {
          if (it.id === "__fab__") {
            const active = tab === "stock" ? "stock" : "caisse";
            return (
              <button
                key="fab"
                onClick={() => openScan(active)}
                className="relative -mt-8 flex h-16 w-16 items-center justify-center rounded-full bg-gradient-to-br from-indigo-600 to-cyan-500 shadow-lg shadow-indigo-500/30"
                style={{ animation: "pulseGlow 2.4s ease-in-out infinite" }}
              >
                <ScanLine size={24} className="text-white" />
              </button>
            );
          }
          const Icon = it.icon;
          const active = tab === it.id || (it.id === "caisse" && tab === "caisse-sell");
          return (
            <button key={it.id} onClick={() => setTab(it.id)} className="flex flex-col items-center gap-1 px-2 py-1">
              <Icon size={20} className={active ? "text-indigo-500" : t.mute} strokeWidth={active ? 2.4 : 2} />
              <span className={cx("text-[10px] font-medium", active ? "text-indigo-500" : t.mute)}>{it.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Authentification ----------
function AuthScreen({ t, theme, setTheme, mode, setMode, onLogin, onSignup }) {
  const [storeName, setStoreName] = useState("");
  const [ownerName, setOwnerName] = useState("");
  const [phone, setPhone] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");

  function submit() {
    if (mode === "signup") {
      onSignup({ storeName: storeName || "Ma boutique", ownerName: ownerName || "Vendeur", phone, email });
    } else {
      onLogin({ email });
    }
  }

  return (
    <div className="flex h-full flex-col overflow-y-auto px-6 pb-10 pt-14">
      <div className="mb-2 flex items-center justify-between">
        <div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-600 to-cyan-500">
          <ShieldCheck size={20} className="text-white" />
        </div>
        <button onClick={() => setTheme(theme === "light" ? "dark" : "light")} className={cx("flex h-9 w-9 items-center justify-center rounded-full", t.surfaceAlt)}>
          {theme === "light" ? <Moon size={16} className={t.text} /> : <Sun size={16} className={t.text} />}
        </button>
      </div>

      <h1 className={cx("mt-5 text-2xl font-bold", t.text)}>{mode === "signup" ? "Créer votre compte" : "Bon retour !"}</h1>
      <p className={cx("mt-1 text-sm", t.sub)}>{mode === "signup" ? "14 jours d'essai gratuit, sans carte bancaire." : "Connectez-vous pour retrouver votre boutique."}</p>

      <div className={cx("mt-5 flex rounded-2xl p-1", t.surfaceAlt)}>
        <button onClick={() => setMode("login")} className={cx("flex-1 rounded-xl py-2 text-sm font-semibold", mode === "login" ? cx(t.surface, t.text, "shadow") : t.sub)}>
          Connexion
        </button>
        <button onClick={() => setMode("signup")} className={cx("flex-1 rounded-xl py-2 text-sm font-semibold", mode === "signup" ? cx(t.surface, t.text, "shadow") : t.sub)}>
          Créer un compte
        </button>
      </div>

      <div className="mt-5 space-y-2.5">
        {mode === "signup" && (
          <>
            <TextField t={t} label="Nom de la boutique" value={storeName} onChange={setStoreName} placeholder="Mobile Store Plus" icon={Store} />
            <TextField t={t} label="Nom du responsable" value={ownerName} onChange={setOwnerName} placeholder="Jean Mabiala" icon={User} />
            <TextField t={t} label="Téléphone" value={phone} onChange={setPhone} placeholder="06 12 34 56 78" icon={Phone} />
          </>
        )}
        <TextField t={t} label="Adresse email" value={email} onChange={setEmail} placeholder="vous@boutique.com" icon={Mail} />
        <TextField t={t} label="Mot de passe" value={password} onChange={setPassword} placeholder="••••••••" icon={Lock} />
      </div>

      {mode === "login" && (
        <button className="mt-2 self-end text-xs font-medium text-indigo-500">Mot de passe oublié ?</button>
      )}

              <div className="mb-2 flex items-start justify-between">
                <div>
                  <p className={cx("text-sm font-semibold", t.text)}>{s.client}</p>
                  <p className={cx("text-xs", t.sub)}>{s.phone}</p>
                </div>
                <span className={cx("rounded-full border px-2.5 py-1 text-xs font-medium", st[status])}>
                  {status === "expired" ? "Expirée" : status === "warning" ? `J-${s.daysLeft}` : `J-${s.daysLeft}`}
                </span>
              </div>
              <div className={cx("mb-3 flex items-center justify-between border-t pt-2.5 text-xs", t.border, t.sub)}>
                <span>{s.product}</span>
                <span className="mono">{s.imei}</span>
              </div>
              <div className="flex gap-2">
                <button className={cx("flex flex-1 items-center justify-center gap-1.5 rounded-xl py-2 text-xs font-semibold", t.chipOff)}>
                  <QrCode size={13} /> Voir le reçu
                </button>
                <button className="flex flex-1 items-center justify-center gap-1.5 rounded-xl bg-indigo-500/10 py-2 text-xs font-semibold text-indigo-500">
                  <RefreshCw size={13} /> {status === "expired" ? "Relancer" : "Renvoyer"}
                </button>
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && (
          <div className="flex flex-col items-center gap-2 py-12 text-center">
            <Search size={24} className={t.mute} />
            <p className={cx("text-xs", t.sub)}>Aucun résultat pour cette recherche.</p>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Réglages ----------

        <div className={cx("mt-3 space-y-1.5 rounded-xl p-3", t.surfaceAlt)}>

            <span className={cx("font-semibold", t.text)}>62 ventes</span>

        <button onClick={onChangePlan} className={cx("mt-3 flex w-full items-center justify-center gap-2 rounded-xl py-2.5 text-xs font-semibold", t.chipOff)}>

        <div className={cx("mt-4 border-t pt-3", t.border)}>

          <div className={cx("flex items-center justify-between rounded-xl px-3 py-2.5", t.surfaceAlt)}>

              <Smartphone size={14} className={t.mute} />
              <span className={cx("text-sm", t.text)}>Mobile Money · •• 88 12</span>
            </div>
            <button className="text-xs font-semibold text-indigo-500">Gérer</button>

          <p className={cx("mb-2 text-xs font-semibold", t.sub)}>HISTORIQUE DE FACTURATION</p>

              <div key={i} className="flex items-center justify-between">

        <ToggleRow t={t} icon={Mail} label="Email" value={false} onChange={() => {}} />

// ---------- Champs réutilisables ----------
function TextField({ t, label, value, onChange, placeholder, icon: Icon }) {
  return (
    <label className="block">
      <span className={cx("mb-1 block text-xs font-medium", t.sub)}>{label}</span>
      <div className={cx("flex items-center gap-2 rounded-xl px-3 py-2.5", t.input)}>
        {Icon && <Icon size={14} className={t.mute} />}
        <input
          value={value}
          onChange={(e) => onChange && onChange(e.target.value)}
          placeholder={placeholder}
          className="w-full flex-1 bg-transparent text-sm outline-none"
        />
      </div>
    </label>
  );
}

function SelectField({ t, label, value }) {
  return (
    <label className="block">
      <span className={cx("mb-1 block text-xs font-medium", t.sub)}>{label}</span>
      <div className={cx("flex items-center justify-between rounded-xl px-3 py-2.5", t.input)}>
        <span className="text-sm">{value}</span>
        <ChevronDown size={14} className={t.mute} />
      </div>
    </label>
  );
}

function ToggleRow({ t, icon: Icon, label, value, onChange }) {
  const [on, setOn] = useState(value);
  useEffect(() => { setOn(value); }, [value]);
  return (
    <div className="flex items-center justify-between py-2">
      <div className="flex items-center gap-2">
        <Icon size={15} className={t.mute} />
        <span className={cx("text-sm", t.text)}>{label}</span>
      </div>
      <button
        onClick={() => { setOn(!on); onChange && onChange(!on); }}
        className={cx("relative h-6 w-11 rounded-full transition-colors", on ? "bg-gradient-to-r from-indigo-600 to-cyan-500" : "bg-slate-300")}
      >
        <span className={cx("absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-all", on ? "left-5" : "left-0.5")} />
      </button>
    </div>
  );
}


// ---------- Montage de l'application ----------
const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<GarantiProApp />);

</script>
